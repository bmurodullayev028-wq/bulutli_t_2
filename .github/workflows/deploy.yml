name: CI/CD Pipeline (2-mustaqil ish)

on:
  push:
    branches: [ "main", "asosiy" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and check syntax
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f talablar.txt ]; then
            pip install -r talablar.txt
          else
            pip install Flask==3.0.0 gunicorn==21.2.0
          fi
          python -m py_compile bulutli_t_2.py

      - name: Build Docker image
        run: |
          docker build -t bulutli-2-topshiriq:latest .
