name: CI/CD Pipeline (2-mustaqil ish)

on:
  push:
    branches: [ "main", "asosiy" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish (Checkout)
        uses: actions/checkout@v4

      - name: Python muhitini sozlash
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bog‘liqliklarni o‘rnatish va sintaksisni tekshirish
        run: |
          python -m pip install --upgrade pip
          pip install -r talablar.txt
          python -m py_compile bulutli_t_2.py

      - name: Docker image yig‘ishni tekshirish (Build test)
        run: |
          docker build -t bulutli-2-topshiriq:latest .
